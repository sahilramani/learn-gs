name: notebooks

# The inline asserts are the test suite, so this executes every notebook and
# throws the result away. The committed .ipynb are never rewritten here: 10-12
# ship with results from an NVIDIA machine, and this runner has no GPU, so
# re-executing them produces the skip path.
#
# It is slow, and almost all of that is one notebook. Measured on a free
# runner (run 31293975486, 2026-08-09): 01-07 together take 36 s, 08 takes
# 2m36s, 10-12 take 14 s between them because they skip without a GPU, and 09
# takes 57m23s on its own for 61 minutes total. Its 800 iterations of dense
# float64 torch on two shared cores are 94 percent of this workflow.
#
# That is why NB_TIMEOUT is raised here. The default of 1500 s in
# tools/build_notebooks.py suits a developer machine and this blows straight
# through it. The value below leaves roughly twice the measured cost, so a
# slow runner reads as slow rather than as a broken notebook, and
# timeout-minutes sits above it so the per-cell ceiling is what fires first
# and says which cell it was.
#
# It is also why this only runs when something it covers changes.

on:
  push:
    branches: [main]
    paths:
      - 'notebooks_src/**'
      - 'src/**'
      - 'cuda/**'
      - 'train/**'
      - 'scripts/**'
      - 'tools/build_notebooks.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/notebooks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'notebooks_src/**'
      - 'src/**'
      - 'cuda/**'
      - 'train/**'
      - 'scripts/**'
      - 'tools/build_notebooks.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/notebooks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NB_TIMEOUT: '7200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Package smoke test
        run: python scripts/render_toy.py
      - name: Execute every notebook
        run: python tools/build_notebooks.py
