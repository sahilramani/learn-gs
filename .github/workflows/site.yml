name: site

# Renders the committed notebooks and publishes them. Deliberately does not
# execute anything: the notebooks ship executed, and 10-12 carry results from
# an NVIDIA machine that a CPU runner cannot reproduce. Re-running the
# curriculum is notebooks.yml's job, and it takes long enough that gating a
# docs deploy on it would mean waiting the better part of an hour to publish
# a typo fix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install nbformat nbconvert jupytext
      - name: Colab editions match their sources
        run: python tools/build_colab.py --check
      - name: Render site
        run: python tools/build_site.py --clean
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
